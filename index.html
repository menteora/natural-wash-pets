<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shampetto | Lavaggio Cani Self-Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              natural: {
                50: '#f7f9f6',
                100: '#ebf2ec',
                200: '#d0e0d2',
                500: '#4a7c59', // Primary Green from logo
                600: '#3d664a',
                700: '#32543e',
                900: '#1a2e22',
              },
              wood: {
                100: '#f5f1ed',
                500: '#8b5e3c', // Brown from logo
                900: '#4a3221',
              }
            },
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.9) translateY(20px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              },
              pulseSubtle: {
                '0%, 100%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.1)' },
              },
              bounceSubtle: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-25%)' },
              },
              bouncePulse: {
                '0%, 100%': { transform: 'translateY(0) scale(1)' },
                '50%': { transform: 'translateY(-25%) scale(1.15)' },
              }
            },
            animation: {
              float: 'float 4s ease-in-out infinite',
              'scale-in': 'scaleIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'pulse-subtle': 'pulseSubtle 2s ease-in-out infinite',
              'bounce-subtle': 'bounceSubtle 0.8s ease-in-out infinite',
              'bounce-pulse': 'bouncePulse 0.8s ease-in-out infinite',
            }
          }
        }
      }
    </script>
    <style>
      .smooth-transition { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
      html { scroll-behavior: smooth; }
      
      .text-reveal-wrapper {
        overflow: hidden;
        display: block;
      }
      
      .stagger-1 { animation-delay: 0.1s; }
      .stagger-2 { animation-delay: 0.3s; }
      .stagger-3 { animation-delay: 0.5s; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "lucide-react": "https://esm.sh/lucide-react@0.454.0"
  }
}
</script>
</head>
<body class="bg-natural-50 text-natural-900 selection:bg-natural-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
